# Config SOLO para los tests: BD en memoria (H2), asi "mvnw package" no necesita MySQL.
spring.application.name=Evalucacion3.ApiUsuarios
spring.datasource.url=jdbc:h2:mem:tienda_test;MODE=MySQL;DB_CLOSE_DELAY=-1
